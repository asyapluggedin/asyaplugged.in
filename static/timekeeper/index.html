<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>timekeeper - asyapluggedin</title>
  <style>
    :root {
      --bg: #faf9f5;
      --ink: #111111;
      --muted: #646464;
      --line: #111111;
      --field: #ffffff;
      --head: #efede7;
      --hover: #e4e1d9;
      --red: #b31422;
      --final: #671024;
    }
    [data-theme="dark"] {
      --bg: #111111;
      --ink: #f7f5ee;
      --muted: #b7b4aa;
      --line: #f7f5ee;
      --field: #181818;
      --head: #242424;
      --hover: #303030;
      --red: #ff6c75;
      --final: #ff8a93;
    }
    * { box-sizing: border-box; }
    body { max-width: 860px; margin: 24px auto; padding: 0 16px 48px; font: 16px/1.35 Georgia, "Times New Roman", serif; color: var(--ink); background: var(--bg); transition: background .15s, color .15s; }
    h1 { margin: 0; font-size: 32px; line-height: 1; font-weight: normal; }
    h2 { font-size: 18px; margin: 30px 0 8px; font-weight: normal; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 9px; }
    .mono, input, button, textarea { font-family: "Courier New", Courier, monospace; }
    table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 14px; }
    th, td { padding: 7px; border: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { font-family: "Courier New", Courier, monospace; font-weight: bold; background: var(--head); }
    input, button, textarea { font-size: 14px; color: var(--ink); }
    input[type="number"] { width: 58px; background: var(--field); border: 1px solid var(--line); padding: 4px; }
    button { color: var(--ink); background: var(--bg); border: 1px solid var(--line); padding: 5px 8px; cursor: pointer; }
    button:hover { color: var(--bg); background: var(--ink); }
    .toggle { display: grid; place-items: center; width: 34px; height: 34px; padding: 4px; border: 0; background: transparent; }
    .toggle:hover { color: var(--ink); background: transparent; }
    .toggle .svg { display: grid; place-items: center; }
    .toggle svg { width: 24px; height: 24px; display: none; }
    [data-theme="light"] .toggle-light, [data-theme="dark"] .toggle-black { display: block; }
    .zone-search { width: 100%; min-width: 170px; color: var(--ink); background: var(--field); border: 1px solid var(--line); padding: 4px; }
    .zone-results { position: absolute; z-index: 1; width: min(460px, calc(100vw - 48px)); margin: 3px 0 0; padding: 0; list-style: none; border: 1px solid var(--line); background: var(--field); max-height: 220px; overflow: auto; }
    .zone-results:empty { display: none; }
    .zone-results button { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: var(--field); padding: 7px 8px; text-align: left; font-size: 13px; }
    .zone-results button:hover, .zone-results button:focus { color: var(--ink); background: var(--hover); }
    .zone-cell { position: relative; }
    .time-cell { white-space: nowrap; line-height: 1.25; }
    .time-cell .date { display: block; }
    .time-cell .time { display: block; font-family: "Courier New", Courier, monospace; }
    .row-actions { white-space: nowrap; }
    .alerts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; font-family: "Courier New", Courier, monospace; font-size: 14px; }
    .alerts label { white-space: nowrap; }
    .hidden { display: none; }
    #timer { font-family: monospace; font-size: clamp(96px, 25vw, 240px); line-height: .85; font-weight: normal; letter-spacing: -.11em; margin: 38px 0 18px; text-align: center; transition: color .12s; }
    #timer.alert { color: var(--red); }
    #timer.end { color: var(--final); }
    #timerMeta { margin: 0 0 12px; white-space: pre-line; text-align: center; font-size: 14px; }
    #history { width: 100%; min-height: 190px; resize: vertical; color: var(--ink); background: var(--field); border: 1px solid var(--line); padding: 8px; line-height: 1.4; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }
    #activeSection .button-row { justify-content: center; }
    .small { font-size: 13px; color: var(--muted); }
    #result { margin: 10px 0; font-family: "Courier New", Courier, monospace; font-size: 14px; white-space: pre-wrap; text-align: center; }
    @media (max-width: 680px) {
      body { padding: 0 10px 36px; }
      table { font-size: 12px; }
      th, td { padding: 5px; }
      .zone-search { min-width: 140px; }
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>Time Keeper</h1>
    <button aria-label="Toggle mode" class="toggle vector" id="themeToggle" type="button">
      <span class="svg">
        <svg viewBox="0 0 32 32" class="toggle-light" fill="currentColor" height="24" width="24" xmlns="http://www.w3.org/2000/svg"><title>asleep</title><path d="M13.5025,5.4136A15.0755,15.0755,0,0,0,25.096,23.6082a11.1134,11.1134,0,0,1-7.9749,3.3893c-.1385,0-.2782.0051-.4178,0A11.0944,11.0944,0,0,1,13.5025,5.4136M14.98,3a1.0024,1.0024,0,0,0-.1746.0156A13.0959,13.0959,0,0,0,16.63,28.9973c.1641.006.3282,0,.4909,0a13.0724,13.0724,0,0,0,10.702-5.5556,1.0094,1.0094,0,0,0-.7833-1.5644A13.08,13.08,0,0,1,15.8892,4.38,1.0149,1.0149,0,0,0,14.98,3Z"></path></svg>
        <svg viewBox="0 0 32 32" class="toggle-black" fill="currentColor" height="24" width="24" xmlns="http://www.w3.org/2000/svg"><title>asleep_black</title><path d="M14.98,3a1.0024,1.0024,0,0,0-.1746.0156A13.0959,13.0959,0,0,0,16.63,28.9973c.1641.006.3282,0,.4909,0a13.0724,13.0724,0,0,0,10.702-5.5556,1.0094,1.0094,0,0,0-.7833-1.5644A13.08,13.08,0,0,1,15.8892,4.38,1.0149,1.0149,0,0,0,14.98,3Z"></path></svg>
      </span>
    </button>
  </div>

  <table>
    <thead><tr><th>Hours</th><th>Minutes</th><th>Seconds</th><th>Time zone</th><th>Start time</th><th>End time</th><th></th></tr></thead>
    <tbody id="zoneRows"></tbody>
  </table>

  <div class="button-row"><button id="addZone">+ Add time zone</button></div>

  <div>
    <strong>Alerts</strong>
    <div id="alerts" class="alerts"></div>
    <div class="button-row"><button id="addAlert">+ Add alert</button><button id="testSound">Test sound</button></div>
  </div>

  <div class="button-row"><button id="startBtn">Start Timekeeper</button></div>

  <section id="activeSection" class="hidden">
    <div id="timer">0:00</div>
    <div id="timerMeta"></div>
    <div class="button-row"><button id="endBtn">End</button><button id="addFiveBtn">Add 5 Minutes</button></div>
    <div id="result"></div>
  </section>

  <h2>Local History Log</h2>
  <textarea id="history" readonly></textarea>
  <div class="button-row"><button id="copyHistory">Copy to clipboard</button><button id="exportHistory">Export history .txt</button></div>
  <p class="small">History is stored only in this browser.</p>

  <script>
    const KEY = 'timekeeper.v1';
    const THEME_KEY = 'theme';
    const store = JSON.parse(localStorage.getItem(KEY) || '{}');
    const detectedZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Los_Angeles';
    store.zones ||= [detectedZone, 'America/New_York']; store.alerts ||= [15,10,5,1]; store.history ||= [];
    store.hours ??= 0; store.minutes ??= 30; store.seconds ??= 0;
    const $ = id => document.getElementById(id);
    let interval, audioContext, finalAlertInterval = null;
    const zoneOptions = [
      ['Los Angeles, United States — Pacific Time','America/Los_Angeles','los angeles la california pacific usa united states'],['Phoenix, United States — Mountain Time','America/Phoenix','phoenix arizona mountain usa united states'],['Denver, United States — Mountain Time','America/Denver','denver colorado mountain usa united states'],['Chicago, United States — Central Time','America/Chicago','chicago illinois central usa united states'],['New York, United States — Eastern Time','America/New_York','new york ny eastern usa united states'],['Anchorage, United States — Alaska Time','America/Anchorage','anchorage alaska usa united states'],['Honolulu, United States — Hawaii Time','Pacific/Honolulu','honolulu hawaii usa united states'],['Vancouver, Canada — Pacific Time','America/Vancouver','vancouver canada british columbia pacific'],['Toronto, Canada — Eastern Time','America/Toronto','toronto canada ontario eastern'],['Mexico City, Mexico — Central Time','America/Mexico_City','mexico city central'],['São Paulo, Brazil — Brasília Time','America/Sao_Paulo','sao paulo brazil brasilia'],['Buenos Aires, Argentina — Argentina Time','America/Argentina/Buenos_Aires','buenos aires argentina'],['UTC — Coordinated Universal Time','UTC','utc universal coordinated gmt'],['London, United Kingdom — UK Time','Europe/London','london uk united kingdom england britain british'],['Paris, France — Central European Time','Europe/Paris','paris france europe central european cet'],['Berlin, Germany — Central European Time','Europe/Berlin','berlin germany deutschland europe central european cet'],['Rome, Italy — Central European Time','Europe/Rome','rome italy italia europe central european cet'],['Madrid, Spain — Central European Time','Europe/Madrid','madrid spain espana europe central european cet'],['Warsaw, Poland — Central European Time','Europe/Warsaw','warsaw poland europe central european cet'],['Kyiv, Ukraine — Eastern European Time','Europe/Kyiv','kyiv kiev ukraine ukrainian europe eastern european eet'],['Moscow, Russia — Moscow Time','Europe/Moscow','moscow russia russian moscow time'],['Istanbul, Türkiye — Türkiye Time','Europe/Istanbul','istanbul turkey turkiye europe'],['Dubai, United Arab Emirates — Gulf Time','Asia/Dubai','dubai uae united arab emirates gulf'],['Delhi, India — India Standard Time','Asia/Kolkata','delhi india kolkata ist'],['Bangkok, Thailand — Indochina Time','Asia/Bangkok','bangkok thailand'],['Singapore — Singapore Time','Asia/Singapore','singapore'],['Hong Kong — Hong Kong Time','Asia/Hong_Kong','hong kong china'],['Shanghai, China — China Standard Time','Asia/Shanghai','shanghai china beijing'],['Tokyo, Japan — Japan Standard Time','Asia/Tokyo','tokyo japan japanese jst'],['Seoul, South Korea — Korea Standard Time','Asia/Seoul','seoul korea south korean kst'],['Perth, Australia — Western Australia Time','Australia/Perth','perth australia western'],['Adelaide, Australia — Central Australia Time','Australia/Adelaide','adelaide australia central'],['Sydney, Australia — Eastern Australia Time','Australia/Sydney','sydney australia eastern'],['Auckland, New Zealand — New Zealand Time','Pacific/Auckland','auckland new zealand nz']
    ];
    function save(){localStorage.setItem(KEY,JSON.stringify(store));}
    function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem(THEME_KEY,theme);}
    function setupTheme(){const saved=localStorage.getItem(THEME_KEY);setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));$('themeToggle').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');}
    function offset(zone,date=new Date()){const parts=new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'longOffset'}).formatToParts(date);return parts.find(p=>p.type==='timeZoneName')?.value?.replace('GMT','UTC')||'UTC+00:00';}
    function optionLabel(zone,date=new Date()){const found=zoneOptions.find(x=>x[1]===zone);return `${found?found[0]:zone} (${offset(zone,date)})`;}
    function dateLine(date,zone){return new Intl.DateTimeFormat(undefined,{timeZone:zone,month:'numeric',day:'numeric',year:'numeric'}).format(date);}
    function timeLine(date,zone){return new Intl.DateTimeFormat(undefined,{timeZone:zone,hour:'numeric',minute:'2-digit',second:'2-digit',timeZoneName:'short'}).format(date);}
    function fullTime(date,zone){return `${dateLine(date,zone)} ${timeLine(date,zone)}`;}
    function durationSeconds(){return Math.max(1,Number($('hours')?.value||0)*3600+Number($('minutes')?.value||0)*60+Number($('seconds')?.value||0));}
    function proposedEnd(){return new Date(Date.now()+durationSeconds()*1000);}
    function ensureAudio(){audioContext||=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();return audioContext;}
    function tone(frequency,at,duration=.16,volume=.18,type='triangle'){const ctx=ensureAudio(),oscillator=ctx.createOscillator(),gain=ctx.createGain();oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(volume,at+.012);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);oscillator.connect(gain).connect(ctx.destination);oscillator.start(at);oscillator.stop(at+duration+.02);}
    function playBeepCount(count){const ctx=ensureAudio();for(let i=0;i<Math.min(Math.max(1,count),10);i++)tone(880,ctx.currentTime+i*.27);}
    function playFinalPhrase(){const ctx=ensureAudio();tone(880,ctx.currentTime,.16,.20,'sine');tone(660,ctx.currentTime+.23,.16,.20,'sine');tone(880,ctx.currentTime+.46,.22,.20,'sine');}
    function startFinalAlert(){if(finalAlertInterval)return;playFinalPhrase();finalAlertInterval=setInterval(playFinalPhrase,2000);}
    function stopFinalAlert(){if(finalAlertInterval){clearInterval(finalAlertInterval);finalAlertInterval=null;}}
    function flashAlert(){const timer=$('timer');timer.classList.add('alert');setTimeout(()=>{if(store.active&&new Date(store.active.finalEnd)>new Date())timer.classList.remove('alert');},1600);}
    function renderTimeCell(cell,date,zone){cell.className='time-cell';cell.innerHTML=`<span class="date">${dateLine(date,zone)}</span><span class="time">${timeLine(date,zone)}</span>`;}
    function zonePicker(zone,index){const wrap=document.createElement('div');wrap.className='zone-cell';const input=document.createElement('input');input.type='search';input.className='zone-search';input.autocomplete='off';input.value=optionLabel(zone);input.setAttribute('aria-label',`Time zone ${index+1}`);const list=document.createElement('ul');list.className='zone-results';function draw(query){const q=query.toLowerCase().trim(),matches=(q?zoneOptions.filter(([label,id,search])=>`${label} ${id} ${search}`.toLowerCase().includes(q)):zoneOptions.slice(0,8)).slice(0,10);list.innerHTML='';matches.forEach(([label,id])=>{const li=document.createElement('li'),button=document.createElement('button');button.type='button';button.textContent=`${label} (${offset(id)})`;button.onclick=()=>{store.zones[index]=id;save();renderTable();};li.appendChild(button);list.appendChild(li);});}input.onfocus=()=>{input.select();draw('');};input.oninput=()=>draw(input.value);input.onblur=()=>setTimeout(()=>{list.innerHTML='';input.value=optionLabel(store.zones[index]);},150);wrap.append(input,list);return wrap;}
    function renderTable(){const body=$('zoneRows'),now=new Date(),end=proposedEnd();body.innerHTML='';store.zones.forEach((zone,index)=>{const tr=document.createElement('tr');tr.innerHTML=index===0?`<td><input id="hours" type="number" min="0" value="${store.hours}"></td><td><input id="minutes" type="number" min="0" value="${store.minutes}"></td><td><input id="seconds" type="number" min="0" max="59" value="${store.seconds}"></td><td></td><td></td><td></td><td></td>`:`<td></td><td></td><td></td><td></td><td></td><td></td><td class="row-actions"></td>`;tr.children[3].appendChild(zonePicker(zone,index));renderTimeCell(tr.children[4],now,zone);renderTimeCell(tr.children[5],end,zone);if(index>0){const remove=document.createElement('button');remove.textContent='−';remove.title='Remove time zone';remove.onclick=()=>{store.zones.splice(index,1);save();renderTable();};tr.lastElementChild.appendChild(remove);}body.appendChild(tr);});$('hours').oninput=updateDuration;$('minutes').oninput=updateDuration;$('seconds').oninput=updateDuration;}
    function updateDuration(){store.hours=Number($('hours').value||0);store.minutes=Number($('minutes').value||0);store.seconds=Number($('seconds').value||0);save();renderTable();}
    function updateTimesOnly(){if(store.active)return;const now=new Date(),end=proposedEnd();[...$('zoneRows').rows].forEach((row,i)=>{renderTimeCell(row.cells[4],now,store.zones[i]);renderTimeCell(row.cells[5],end,store.zones[i]);});}
    function renderAlerts(){$('alerts').innerHTML=store.alerts.map((a,i)=>`<label><input type="checkbox" checked data-index="${i}"> ${a} min</label>`).join('');}
    function addAlert(){const n=Number(prompt('Alert time in minutes:','3'));if(Number.isFinite(n)&&n>0&&!store.alerts.includes(n)){store.alerts.push(n);store.alerts.sort((a,b)=>b-a);save();renderAlerts();}}
    function selectedAlerts(){return[...document.querySelectorAll('#alerts input:checked')].map(x=>store.alerts[Number(x.dataset.index)]);}
    function start(){ensureAudio();playBeepCount(1);const secs=durationSeconds(),now=new Date();stopFinalAlert();store.active={started:now.toISOString(),originalSeconds:secs,addedSeconds:0,finalEnd:new Date(now.getTime()+secs*1000).toISOString(),zones:[...store.zones],alerts:selectedAlerts(),played:[],finalAlertPlayed:false};save();$('activeSection').classList.remove('hidden');$('result').textContent='';updateActive();clearInterval(interval);interval=setInterval(updateActive,250);}
    function updateActive(){if(!store.active)return;const a=store.active,remaining=Math.max(0,Math.ceil((new Date(a.finalEnd)-Date.now())/1000)),timer=$('timer');timer.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;timer.classList.toggle('end',remaining===0);const end=new Date(a.finalEnd);$('timerMeta').textContent=a.zones.map(z=>`Ends ${fullTime(end,z)}`).join('\n');a.alerts.forEach(minutes=>{if(remaining<=minutes*60&&!a.played.includes(minutes)){a.played.push(minutes);save();playBeepCount(minutes);flashAlert();}});if(remaining===0&&!a.finalAlertPlayed){a.finalAlertPlayed=true;save();startFinalAlert();}}
    function deltaText(seconds){const sign=seconds<0?'−':'+';const n=Math.abs(seconds);return `${sign}${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;}
    function planText(seconds){const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;return `${h}h ${m}m ${s}s`;}
    function endTask(){if(!store.active)return;const a=store.active,ended=new Date(),delta=Math.round((ended-new Date(a.finalEnd))/1000),originalMinutes=a.originalSeconds/60,grace=Math.min(10,Math.max(2,originalMinutes*.2)),outcome=delta<=grace*60?'SUCCESS':'FAILURE';store.history.unshift({started:a.started,ended:ended.toISOString(),originalSeconds:a.originalSeconds,addedSeconds:a.addedSeconds,finalSeconds:a.originalSeconds+a.addedSeconds,finalEnd:a.finalEnd,zones:a.zones,delta,grace,outcome});store.active=null;save();clearInterval(interval);stopFinalAlert();$('timer').className='';renderHistory();$('result').textContent=`Result: ${deltaText(delta)}\nOutcome: ${outcome}`;}
    function addFive(){if(!store.active)return;stopFinalAlert();$('timer').className='';store.active.finalEnd=new Date(new Date(store.active.finalEnd).getTime()+300000).toISOString();store.active.addedSeconds+=300;store.active.finalAlertPlayed=false;save();updateActive();}
    function historyText(){return store.history.map(e=>`${e.zones.map(z=>`${z}: ${fullTime(new Date(e.started),z)} → ${fullTime(new Date(e.ended),z)}`).join(' | ')}\nPlan: ${planText(e.originalSeconds)} | Added: ${planText(e.addedSeconds)} | Final: ${planText(e.finalSeconds)} | Result: ${deltaText(e.delta)} | ${e.outcome}`).join('\n\n');}
    function renderHistory(){$('history').value=historyText();}
    function downloadHistory(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([historyText()||'No history.'],{type:'text/plain'}));a.download='timekeeper-history.txt';a.click();URL.revokeObjectURL(a.href);}
    $('addZone').onclick=()=>{store.zones.push('UTC');save();renderTable();};$('addAlert').onclick=addAlert;$('testSound').onclick=()=>{ensureAudio();playFinalPhrase();};$('startBtn').onclick=start;$('endBtn').onclick=endTask;$('addFiveBtn').onclick=addFive;$('copyHistory').onclick=async()=>{await navigator.clipboard.writeText($('history').value);};$('exportHistory').onclick=downloadHistory;
    setupTheme();renderTable();renderAlerts();renderHistory();if(store.active){$('activeSection').classList.remove('hidden');updateActive();interval=setInterval(updateActive,250);}setInterval(updateTimesOnly,1000);
  </script>
</body>
</html>
